name: Build LumaLink (WinUI 3)

on:
  push:
    branches: [ "claude/**", main, master ]
    paths: [ "LumaLink.Win/**", ".github/workflows/build-windows.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish (win-x64, self-contained)
        run: dotnet publish LumaLink.Win/LumaLink.csproj -c Release -r win-x64 -p:Platform=x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: LumaLink-win-x64
          path: publish/
